name: Update trh-sdk dependency

on:
  repository_dispatch:
    types: [trh-sdk-updated]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update trh-sdk to new commit
        run: |
          go get github.com/tokamak-network/trh-sdk@${{ github.event.client_payload.commit }}
          go mod tidy

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --staged --quiet || git commit -m "chore: update trh-sdk to ${{ github.event.client_payload.commit }}"
          git push origin main
